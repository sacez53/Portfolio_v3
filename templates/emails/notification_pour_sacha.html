<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau message du portfolio</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; color:#222222; -webkit-text-size-adjust:100%;">
    <div style="max-width:600px; margin:0 auto; padding:24px 16px; font-family:Arial, Helvetica, sans-serif; font-size:17px; line-height:1.65; overflow-wrap:anywhere; word-wrap:break-word;">
        <h1 style="margin:0 0 20px; color:#245780; font-size:23px; line-height:1.35;">Nouveau message du portfolio</h1>
        <p style="margin:0 0 16px;">
            <strong>{{name}}</strong><br>
            <a href="mailto:{{email}}" style="color:#245780; text-decoration:underline; overflow-wrap:anywhere; word-break:break-word;">{{email}}</a>
        </p>
        <p style="margin:0 0 20px;"><strong>Objet :</strong> {{subject}}</p>
        <div style="margin:0 0 24px; white-space:pre-wrap; overflow-wrap:anywhere; word-wrap:break-word; word-break:break-word;">{{message}}</div>
        <p style="margin:0;"><a href="mailto:{{email}}" style="color:#245780; text-decoration:underline;">Répondre à {{name}}</a></p>
        <div style="margin-top:32px; border-top:1px solid #d6e0e9; padding-top:20px;">
            <p style="margin:0; color:#245780; font-size:21px; font-weight:bold;">Sacha GUITTER</p>
            <p style="margin:2px 0 12px; color:#555555; font-size:16px;">Photographie · Direction artistique</p>
            <p style="margin:0; font-size:16px;">
                <a href="mailto:sachaguitterphoto@gmail.com" style="color:#245780; text-decoration:underline; overflow-wrap:anywhere; word-break:break-word;">sachaguitterphoto@gmail.com</a><br>
                <a href="tel:+33749610990" style="color:#245780; text-decoration:underline;">07 49 61 09 90</a>
            </p>
            <p style="margin:12px 0 0; font-size:16px;">
                <a href="https://sacez53.github.io/Portfolio_v3/" style="color:#245780; text-decoration:underline;">Mon portfolio</a>
                &nbsp;·&nbsp;
                <a href="https://instagram.com/sacha.guitter.photo" style="color:#245780; text-decoration:underline;">Instagram</a>
            </p>
        </div>
    </div>
</body>
</html>
