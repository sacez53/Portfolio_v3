name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions minimales requises pour le déploiement sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Annule les déploiements concurrents en cours pour ne conserver que le dernier commit
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Configuration de Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation stricte des dépendances
        run: npm ci

      - name: Compilation et vérification des chemins
        run: npm test

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v6

      - name: Téléversement de l'artefact de build
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          include-hidden-files: true

  # Job séparé : l'artefact est finalisé et visible avant le déploiement
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
